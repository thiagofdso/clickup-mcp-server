apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickup-mcp-deployment
  labels:
    app: clickup-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickup-mcp
  template:
    metadata:
      labels:
        app: clickup-mcp
    spec:
      containers:
        - name: clickup-mcp
          image: ghcr.io/taazkareem/clickup-mcp-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKUP_API_KEY
              value: "<replace-with-api-key>"
            - name: CLICKUP_TEAM_ID
              value: "9011970959"
            - name: ENABLE_SSE
              value: "true"
            - name: ENABLE_STDIO
              value: "false"
            - name: PORT
              value: "3231"
            - name: LOG_LEVL
              value: "DEBUG"
            - name: HEADER_AUTHENTICATION
              value: "true"
            - name: HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 3231
