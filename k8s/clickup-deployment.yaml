apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickup-mcp-deployment
  labels:
    app: clickup-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickup-mcp
  template:
    metadata:
      labels:
        app: clickup-mcp
    spec:
      containers:
        - name: clickup-mcp
          command: ["sh", "-c"]
          args:
            - |
              node build/index.js &
              pid=$!
              echo "Server PID: $pid"
              sleep 600        
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKUP_API_KEY
              value: "<replace-with-api-key>"
            - name: CLICKUP_TEAM_ID
              value: "9011970959"
            - name: ENABLE_SSE
              value: "true"
            - name: ENABLE_STDIO
              value: "false"
            - name: PORT
              value: "3231"
            - name: LOG_LEVL
              value: "DEBUG"
            - name: HEADER_AUTHENTICATION
              value: "true"
            - name: HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 3231            
          livenessProbe:
            httpGet:
              path: /health
              port: 3231
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3231
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
